[project]
name = "simple-merge-app"
version = "0.1.0"
description = "SimpleMerge - A simple GUI to merge PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.2.0",
    "tkinterdnd2>=0.4.3",
]

[project.scripts]
simple-merge = "main:main"

[dependency-groups]
dev = [
    "coverage>=7.11.3",
    "pylint>=4.0.3",
    "pytest>=9.0.0",
]

[tool.uv]
managed = true

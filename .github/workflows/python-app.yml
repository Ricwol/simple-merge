name: CI

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv venv
    
    - name: Install project dependencies
      run: uv pip install -r pyproject.toml
    
    - name: Install dev dependencies
      run: uv pip install pytest coverage
    
    - name: Check if tests exists
      id: check_tests
      run: |
        if [ -n "$(find tests -name 'test_*.py' -print -quit)" ]; then
          echo "tests_exists=true" >> $GITHUB_OUTPUT
        else
          echo "tests_exists=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Run unit tests
      if: steps.check_tests.outputs.tests_exists == 'true'
      run: uv run pytest -q
    
    - name: Run coverage
      if: steps.check_tests.outputs.tests_exists == 'true'
      run: |
        uv run coverage run -m pytest
        uv run coverage xml
        uv run coverage report --fail-under=80

    - name: Upload coverage report
      if: steps.check_tests.outputs.tests_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
